services:
  - type: web
    name: ai-phishing-detector
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install torch>=2.2.0 --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --timeout 180 --workers 1 --threads 4 app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: ENABLE_DESKTOP_NOTIFICATIONS
        value: "false"
      - key: FLASK_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
